name: Check and deploy VINASIG Favicon Forge

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: favicon-forge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npx --yes npm@12.2.0 ci --ignore-scripts --no-fund

      - name: Determine Pages base path
        id: site
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "site_url=https://$owner.github.io" >> "$GITHUB_OUTPUT"
          if [[ "$repository" == *.github.io ]]; then
            echo "base_path=" >> "$GITHUB_OUTPUT"
          else
            echo "base_path=/$repository" >> "$GITHUB_OUTPUT"
          fi

      - name: Check source and standards
        run: npx --yes npm@12.2.0 run check

      - name: Unit regressions
        run: npx --yes npm@12.2.0 test

      - name: Build Astro site
        run: npx --yes npm@12.2.0 run build
        env:
          BASE_PATH: ${{ steps.site.outputs.base_path }}
          SITE_URL: ${{ steps.site.outputs.site_url }}

      - name: Install browser engines
        run: npx --yes npm@12.2.0 exec -- playwright install --with-deps chromium firefox webkit

      - name: Browser, accessibility and package regressions
        run: npx --yes npm@12.2.0 run test:browser
        env:
          BASE_PATH: ${{ steps.site.outputs.base_path }}
          SITE_URL: ${{ steps.site.outputs.site_url }}

      - name: Responsive regressions
        run: npx --yes npm@12.2.0 run test:responsive
        env:
          BASE_PATH: ${{ steps.site.outputs.base_path }}
          SITE_URL: ${{ steps.site.outputs.site_url }}

      - name: Retain check reports and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checks-${{ matrix.os }}-${{ github.sha }}
          path: |
            output/checks/
            output/responsive/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Pages artifact
        if: matrix.os == 'ubuntu-latest' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
